<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion – GameMarket</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">
</head>
<body class="plain">
<header>
  <div class="bar">
    <a class="logo" href="index.html" style="text-decoration:none">Game<b>Market</b></a>
    <a class="btn ghost" href="index.html">Retour aux annonces</a>
  </div>
</header>

<main class="auth">
  <div class="auth-card">
    <div>
      <h1 id="aTitle">Connexion</h1>
      <p class="sm" id="aSub">Connectez-vous pour publier et gérer vos annonces.</p>
    </div>

    <button class="gbtn" id="gBtn" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuer avec Google
    </button>

    <div class="or">ou avec votre email</div>

    <form id="aForm" class="auth-form" novalidate>
      <div id="aMsg" class="amsg" role="alert" hidden></div>
      <label class="f" id="fName" hidden><span>Pseudo</span><input id="aName" maxlength="30" autocomplete="nickname" placeholder="Pseudo affiché sur vos annonces"></label>
      <label class="f"><span>Email</span><input id="aMail" type="email" autocomplete="email" placeholder="vous@gmail.com"></label>
      <label class="f"><span>Mot de passe</span><input id="aPass" type="password" autocomplete="current-password" placeholder="6 caractères minimum"></label>
      <button class="btn" id="aGo" type="submit">Se connecter</button>
      <button class="linkbtn" id="aForgot" type="button">Mot de passe oublié ?</button>
    </form>

    <p class="sm"><span id="aSwitchTxt">Pas encore de compte ?</span> <button class="linkbtn" id="aSwitch" type="button">Créer un compte</button></p>
  </div>
</main>

<script type="module" src="firebase.js"></script>
<script src="auth.js"></script>
</body>
</html>
